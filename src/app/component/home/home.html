@if(loading()){
    <div id="cardLoader">
          <p-progressSpinner></p-progressSpinner>
    </div>
}

@if(error()){
    <p-card>
      {{ error() }}
    </p-card>
}

@if(!loading() && !error()){
  <div>
    <p>Bienvenue {{user()}}</p>
  </div>
    <p-table [value]="products()" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Nom</th>
          <th>Quantité</th>
          <th>Type</th>
          <th>Catégorie</th>
          <th>Ajouter</th>
          <th>Supprimer</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.name }}</td>
          <td>{{ product.quantity }}</td>
          <td>{{ product.type }}</td>
          <td>{{ product.category.name }}</td>
          <td>
             <p-button label="Ajouter" severity="success" />
          </td>
          <td>
             <p-button label="Supprimer" severity="danger" />
          </td>
        </tr>
      </ng-template>
    </p-table>
}
